name: US Mistral Desk (advisory, shadow)

# SHADOW of the Gemini US desk: same triggers, separate script + output
# files + concurrency group, so both desks judge every batch independently.
# Judges new signal batches from signals/latest.json during the US session.
# The script itself checks ET session hours and signal freshness, so this
# UTC window only needs to cover 09:30-16:00 ET across DST (13:30-21:00 UTC).
# Two triggers, by design:
#  * push on signals/latest.json — the primary trigger. Every time the Oracle
#    agent pushes a new batch, a run starts within ~a minute. This is what
#    makes it near-real-time; scheduled runs alone are best-effort on GitHub
#    and can be delayed or skipped (Oct 23 saw only 3 scheduled runs).
#  * schedule every 3 min in the session window — a backup, in case a push
#    run is missed or delayed. A run that finds the batch already judged
#    exits in seconds with no Gemini call and no commit (see dedupe below).
# Marking done: the script appends every judged batch's signal_id to
# desk_history_mistral.json and commits it (commit message carries [skip ci], so
# the desk's own commit does NOT retrigger this workflow). On the next run,
# if that signal_id is already in desk_history_mistral.json, the script prints
# "already judged; skipping" and stops — it never re-judges the same batch,
# and the next new signal_id is what gets picked up.
# The concurrency group queues runs instead of cancelling them, so a cron
# run that starts while a push run is still judging will wait, then see
# the new history and skip — no double judging, no double Telegram.
on:
  push:
    branches: [main]
    paths: ["signals/latest.json"]
  schedule:
    - cron: "*/3 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: us-desk-mistral
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Judge new candidates
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ secrets.MISTRAL_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/assistant_desk_us_mistral.py
      - name: Commit desk outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in desk_verdict_mistral.json desk_history_mistral.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "No desk changes to commit"
          else
            git commit -m "US Mistral desk verdict update [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
