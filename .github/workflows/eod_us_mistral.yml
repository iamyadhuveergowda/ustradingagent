name: US Mistral EOD Scoring

# SCORING ONLY for the Mistral shadow desk. 21:45 UTC = 30 min after the
# Gemini US EOD (21:15 UTC), so both EODs never race on git. Scores
# desk_history_mistral.json with the identical first-hit rules and commits
# ONLY that file. No Telegram, no LLM narration, no agent book — the Gemini
# US EOD already reports those.
on:
  schedule:
    - cron: "45 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: us-eod-mistral
  cancel-in-progress: false

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Score Mistral desk verdicts (no Telegram, no LLM)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 .github/scripts/eod_summary_us_mistral.py
      - name: Commit scored desk history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f desk_history_mistral.json ]; then git add desk_history_mistral.json; fi
          if git diff --staged --quiet; then
            echo "No scoring changes to commit"
          else
            git commit -m "US Mistral EOD: desk outcomes scored [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin ${{ github.ref_name }} && git push; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              echo "Push attempt $attempt failed; retrying..."
              sleep 5
              if [ "$attempt" = "3" ]; then echo "ERROR: push failed after 3 attempts" >&2; exit 1; fi
            done
          fi
